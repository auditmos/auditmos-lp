name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # See the same step in ci.yml: `wrangler types` runs from `prepare` during
      # install and types `Env` from wrangler.jsonc plus `.dev.vars`, so without
      # this the routes needing OAUTH_SIGNING_KEY fail the type check below.
      - name: Seed .dev.vars so Env types include runtime secrets
        run: cp .dev.vars.example .dev.vars

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:ci

      - name: Type check
        run: pnpm run types

      - name: Test
        run: pnpm run test

      - name: Knip
        run: pnpm run knip

      # Runs semantic-release. Conventional Commits → version bump:
      #   feat:                                            → minor
      #   fix: / perf: / revert: / refactor:               → patch
      #   BREAKING CHANGE: footer (or `!` after type)      → major
      #   docs: / chore: / ci: / style: / test: / build:   → no release
      # Full rule set in .releaserc.json (commit-analyzer plugin).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
