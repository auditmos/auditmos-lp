name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # `wrangler types` runs from the `prepare` script during install and types
      # `Env` from wrangler.jsonc plus `.dev.vars`. Without this, runtime-only
      # secrets (OAUTH_SIGNING_KEY) are missing from `Env` and the routes that
      # require them fail to typecheck here while passing locally. Placeholder
      # values only — the example file is the canonical key list, enforced by
      # scripts/env-example.test.ts.
      - name: Seed .dev.vars so Env types include runtime secrets
        run: cp .dev.vars.example .dev.vars

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm types && pnpm lint && pnpm knip && pnpm test
